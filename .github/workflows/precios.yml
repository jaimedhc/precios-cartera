name: Precios

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "precios.py"
      - "activos.json"
      - "vigilancia_lista.json"
      - "requirements.txt"
      - ".github/workflows/precios.yml"

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar precios
        run: python precios.py

      - name: Guardar precios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add precios.json msci.json estado.json vigilancia.json historial.json cambios.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Precios $(date -u +%Y-%m-%dT%H:%MZ)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
